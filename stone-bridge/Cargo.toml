[package]
name = "stone-bridge"
version = "0.0.1"
edition = "2024"


[[bin]]
name = "stonebridge"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std", "now", "clock"] }
tokio = { version = "1",  features = ["macros", "rt-multi-thread"]  }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
base64 = "0.23.1"
